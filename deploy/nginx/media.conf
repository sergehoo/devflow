server {
    listen 80;

    # SECURITY — les MEDIA ne sont plus servis publiquement : chaque requête
    # passe par Django (project.views_media.protected_media) qui vérifie la
    # session et l'appartenance au workspace.
    location /media/ {
        proxy_pass http://devflowweb:8000;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Cible interne de X-Accel-Redirect (MEDIA_X_ACCEL_REDIRECT=True côté Django).
    location /protected-media/ {
        internal;
        alias /usr/share/nginx/html/media/;
        add_header Cache-Control "private, no-store";
    }
}
