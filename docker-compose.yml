services:
  devflowweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflowweb
    command: >
      gunicorn ProjectFlow.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 300
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 150
      --access-logfile -
      --error-logfile -
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs

    environment:
      # Django
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-ProjectFlow.settings}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - SITE_ID=${SITE_ID:-1}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}
      - LANGUAGE_CODE=${LANGUAGE_CODE:-fr-fr}
      - USE_X_FORWARDED_HOST=True
      - SECURE_PROXY_SSL_HEADER=HTTP_X_FORWARDED_PROTO,https

      # Static / media
      - STATIC_URL=/static/
      - STATIC_ROOT=/app/staticfiles
      - MEDIA_URL=/media/
      - MEDIA_ROOT=/app/media

      # Database
      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=devflowdb
      - DB_PORT=5432

      # Redis / Celery
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # Email
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-noreply@${DOMAIN}}

      # AI / external integrations
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}

      # Storage / imports
      - FILE_UPLOAD_MAX_MEMORY_SIZE=${FILE_UPLOAD_MAX_MEMORY_SIZE:-10485760}
      - DATA_UPLOAD_MAX_MEMORY_SIZE=${DATA_UPLOAD_MAX_MEMORY_SIZE:-26214400}

      # App
      - DEVFLOW_ENV=${DEVFLOW_ENV:-production}
      - ENABLE_AI_INSIGHTS=${ENABLE_AI_INSIGHTS:-True}
      - ENABLE_NOTIFICATIONS=${ENABLE_NOTIFICATIONS:-True}
      - ENABLE_WORKSPACE_INVITATIONS=${ENABLE_WORKSPACE_INVITATIONS:-True}
    env_file:
      - .env
    depends_on:
      - devflowdb
      - redis
    networks:
      - proxy
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # Main HTTPS router
      - "traefik.http.routers.devflow.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.devflow.entrypoints=websecure"
      - "traefik.http.routers.devflow.tls=true"
      - "traefik.http.routers.devflow.tls.certresolver=lets"

      # HTTP -> HTTPS redirection
      - "traefik.http.routers.devflow-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.devflow-http.entrypoints=web"
      - "traefik.http.routers.devflow-http.middlewares=devflow-redirect-https"

      - "traefik.http.middlewares.devflow-redirect-https.redirectscheme.scheme=https"

      # Gunicorn internal service
      - "traefik.http.services.devflow.loadbalancer.server.port=8000"

      # Security / compression
      - "traefik.http.middlewares.devflow-compress.compress=true"
      - "traefik.http.middlewares.devflow-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.devflow-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.devflow-sec.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.devflow-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.devflow-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.devflow-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.devflow-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.devflow-sec.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.devflow.middlewares=devflow-compress,devflow-sec"
    restart: unless-stopped

  devflowcelery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflowcelery
    # PR-REC : ajout de la queue 'recordings' pour la transcription audio
    command: celery -A ProjectFlow.celery:app worker -Q default,celery,notifications,recordings -l info --concurrency=4
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-ProjectFlow.settings}
      - SECRET_KEY=${SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}

      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media

      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=devflowdb
      - DB_PORT=5432

      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SENTRY_DSN=${SENTRY_DSN:-}

      - DEVFLOW_ENV=${DEVFLOW_ENV:-production}
      - ENABLE_AI_INSIGHTS=${ENABLE_AI_INSIGHTS:-True}
      - ENABLE_NOTIFICATIONS=${ENABLE_NOTIFICATIONS:-True}
    env_file:
      - .env
    depends_on:
      - devflowdb
      - redis
    networks:
      - default
    restart: unless-stopped

  devflowbeat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflowbeat
    command: celery -A ProjectFlow.celery:app beat -l info
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-ProjectFlow.settings}
      - SECRET_KEY=${SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}

      - STATIC_ROOT=/app/staticfiles
      - MEDIA_ROOT=/app/media

      - DB_ENGINE=${DB_ENGINE:-django.db.backends.postgresql}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=devflowdb
      - DB_PORT=5432

      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - DEVFLOW_ENV=${DEVFLOW_ENV:-production}
    env_file:
      - .env
    depends_on:
      - devflowdb
      - redis
    networks:
      - default
    restart: unless-stopped

  devflowflower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devflowflower
    command: >
      celery -A ProjectFlow.celery:app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin123}
    environment:
      - DEBUG=${DEBUG:-False}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-ProjectFlow.settings}
      - SECRET_KEY=${SECRET_KEY}
      - TIME_ZONE=${TIME_ZONE:-Africa/Abidjan}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
      - devflowcelery
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.devflowflower.rule=Host(`flower.${DOMAIN}`)"
      - "traefik.http.routers.devflowflower.entrypoints=websecure"
      - "traefik.http.routers.devflowflower.tls=true"
      - "traefik.http.routers.devflowflower.tls.certresolver=lets"
      - "traefik.http.services.devflowflower.loadbalancer.server.port=5555"
      - "traefik.http.middlewares.devflowflower-compress.compress=true"
      - "traefik.http.routers.devflowflower.middlewares=devflowflower-compress"
    restart: unless-stopped

  devflowdb:
    image: postgis/postgis:15-3.4
    container_name: devflowdb
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=${TIME_ZONE:-Africa/Abidjan}
      - PGTZ=${TIME_ZONE:-Africa/Abidjan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5438:5432"
    networks:
      - default
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: unless-stopped

  devflowadminer:
    image: adminer:4
    container_name: devflow-adminer
    depends_on:
      - devflowdb
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=devflowdb
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.devflowadminer.rule=Host(`${ADMINER}`)"
      - "traefik.http.routers.devflowadminer.entrypoints=websecure"
      - "traefik.http.routers.devflowadminer.tls=true"
      - "traefik.http.routers.devflowadminer.tls.certresolver=lets"
      - "traefik.http.services.devflowadminer.loadbalancer.server.port=8080"

      # Sécurité Adminer
      - "traefik.http.routers.devflowadminer.middlewares=devflowadminer-auth"

      # Remplace le hash par ton vrai hash htpasswd
      - "traefik.http.middlewares.devflowadminer-auth.basicauth.users=admin:$$apr1$$VFdJ.p2Y$$eDQsjP08sKPezxrPpeErK1"
  devflowmedia:
    image: nginx:alpine
    container_name: devflow-media
    volumes:
      - media_volume:/usr/share/nginx/html/media
      - ./deploy/nginx/media.conf:/etc/nginx/conf.d/default.conf
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.devflowmedia.rule=Host(`${DOMAIN}`) && PathPrefix(`/media/`)"
      - "traefik.http.routers.devflowmedia.priority=100"
      - "traefik.http.routers.devflowmedia.entrypoints=websecure"
      - "traefik.http.routers.devflowmedia.tls=true"
      - "traefik.http.routers.devflowmedia.tls.certresolver=lets"
      - "traefik.http.services.devflowmedia.loadbalancer.server.port=80"
    restart: unless-stopped
  devflowminio:
    image: minio/minio:latest
    container_name: devflowminio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # CRITIQUE : sans ces deux variables, les presigned URLs sont cassees
      # et la console fait des boucles de redirection derriere le reverse proxy
      MINIO_SERVER_URL: "https://storage-flow.datarium-dev.com"
      MINIO_BROWSER_REDIRECT_URL: "https://flow-minio-console.datarium-dev.com"
    volumes:
      - devflowminio_data:/data
    networks:
      # CRITIQUE : doit etre sur 'proxy' pour que Traefik puisse l'atteindre
      - default
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      # ─── API S3 (port 9000) ─────────────────────────────────────
      - "traefik.http.routers.devflowminio-api.rule=Host(`storage-flow.datarium-dev.com`)"
      - "traefik.http.routers.devflowminio-api.entrypoints=websecure"
      - "traefik.http.routers.devflowminio-api.tls=true"
      - "traefik.http.routers.devflowminio-api.tls.certresolver=lets"
      - "traefik.http.routers.devflowminio-api.service=devflowminio-api"
      - "traefik.http.services.devflowminio-api.loadbalancer.server.port=9000"

      # ─── Console web (port 9001) ────────────────────────────────
      - "traefik.http.routers.devflowminio-console.rule=Host(`flow-minio-console.datarium-dev.com`)"
      - "traefik.http.routers.devflowminio-console.entrypoints=websecure"
      - "traefik.http.routers.devflowminio-console.tls=true"
      - "traefik.http.routers.devflowminio-console.tls.certresolver=lets"
      - "traefik.http.routers.devflowminio-console.service=devflowminio-console"
      - "traefik.http.services.devflowminio-console.loadbalancer.server.port=9001"

      # ─── Redirection HTTP -> HTTPS ──────────────────────────────
      - "traefik.http.routers.devflowminio-api-http.rule=Host(`storage-flow.datarium-dev.com`)"
      - "traefik.http.routers.devflowminio-api-http.entrypoints=websecure"
      - "traefik.http.routers.devflowminio-api-http.service=devflowminio-api"
      - "traefik.http.routers.devflowminio-api-http.middlewares=devflowminio-redirect"
      - "traefik.http.routers.devflowminio-console-http.rule=Host(`flow-minio-console.datarium-dev.com`)"
      - "traefik.http.routers.devflowminio-console-http.entrypoints=websecure"
      - "traefik.http.routers.devflowminio-console-http.service=devflowminio-console"
      - "traefik.http.routers.devflowminio-console-http.middlewares=devflowminio-redirect"
      - "traefik.http.middlewares.devflowminio-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.devflowminio-redirect.redirectscheme.permanent=true"


  ollama:
    image: ollama/ollama:latest
    container_name: devflow_ollama
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_QUEUE: 20
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - default
      - proxy
volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  ollama_data:
  devflowminio_data:

networks:
  proxy:
    external: true