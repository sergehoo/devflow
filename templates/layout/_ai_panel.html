{% load static %}
{# DevFlow AI — Panneau conversationnel branché sur le backend #}
<div class="ai-panel" id="aiPanel"
     x-data="devflowAIPanel()"
     x-init="init()"
     :class="{ 'expanded': sizeMode === 'expanded', 'fullscreen': sizeMode === 'fullscreen' }">

  <div class="ai-panel-head">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--cyan));display:flex;align-items:center;justify-content:center">
        <div class="ai-pulse" style="background:#fff"></div>
      </div>
      <div>
        <div style="font-size:13.5px;font-weight:700;color:var(--text1)">DevFlow AI</div>
        <div style="font-size:10.5px;display:flex;align-items:center;gap:4px"
             :style="aiOnline ? 'color:var(--green)' : 'color:var(--amber)'">
          <span class="sprint-pip" style="width:5px;height:5px;animation:breathe 2s ease-in-out infinite"></span>
          <span x-text="aiOnline ? 'En ligne' : 'Mode déterministe'"></span>
          <template x-if="contextSummary && contextSummary.workspace_name">
            <span style="margin-left:6px;color:var(--text3);font-weight:500" x-text="'· ' + contextSummary.workspace_name"></span>
          </template>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      {# Bouton : largeur normale → agrandi → plein écran → normal #}
      <button class="btn-soft ai-size-btn" type="button"
              @click="cycleSize()"
              style="font-size:11px;padding:4px 8px"
              :title="sizeMode === 'normal' ? 'Agrandir le panel'
                      : sizeMode === 'expanded' ? 'Passer en plein écran'
                      : 'Revenir à la taille normale'">
        <template x-if="sizeMode === 'normal'">
          {# Maximize-2 icon #}
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </template>
        <template x-if="sizeMode === 'expanded'">
          {# Fullscreen icon #}
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
            <path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </template>
        <template x-if="sizeMode === 'fullscreen'">
          {# Minimize icon #}
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
            <line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </template>
      </button>
      <button class="btn-soft" style="font-size:11px" @click="closeAI()">✕ Fermer</button>
    </div>
  </div>

  <div class="ai-messages" id="aiMessages" x-ref="messages">
    <template x-for="msg in messages" :key="msg.id">
      <div class="ai-msg" :class="msg.role === 'user' ? 'user' : 'bot'">
        <div class="ai-bubble ai-markdown" x-html="msg.html"
             x-init="$nextTick(() => devflowAIRender($el))"></div>
        <div class="ai-time" x-text="msg.time"></div>
      </div>
    </template>

    <div class="ai-msg bot" x-show="loading" style="display:none">
      <div class="ai-bubble">
        <span class="ai-typing">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
      </div>
    </div>
  </div>

  <div class="ai-suggestion">
    <template x-for="chip in suggestions" :key="chip">
      <div class="ai-chip" @click="sendMessage(chip)" x-text="chip"></div>
    </template>
  </div>

  <div class="ai-input-wrap">
    <textarea class="ai-input" id="aiInput" rows="1"
              placeholder="Poser une question…"
              x-model="draft"
              :disabled="loading"
              @keydown.enter.prevent="if(!$event.shiftKey){submit()}"></textarea>
    <button class="ai-send" @click="submit()" :disabled="loading || !draft.trim()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">
        <line x1="22" y1="2" x2="11" y2="13"/>
        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<style>
  .ai-typing { display:inline-flex; gap:4px; padding:4px 0; }
  .ai-typing .dot {
    width:6px; height:6px; border-radius:50%; background:var(--text3);
    animation: aiTyping 1.2s ease-in-out infinite;
  }
  .ai-typing .dot:nth-child(2) { animation-delay: .15s; }
  .ai-typing .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes aiTyping {
    0%, 60%, 100% { opacity:.25; transform: translateY(0); }
    30%           { opacity:1;   transform: translateY(-3px); }
  }

  /* ── Markdown styling pour les réponses IA ───────────────────── */
  .ai-markdown { line-height: 1.55; font-size: 13px; }
  .ai-markdown > *:first-child { margin-top: 0; }
  .ai-markdown > *:last-child  { margin-bottom: 0; }
  .ai-markdown h1, .ai-markdown h2, .ai-markdown h3, .ai-markdown h4 {
    margin: 14px 0 6px; font-weight: 700; color: var(--text1);
    line-height: 1.25;
  }
  .ai-markdown h1 { font-size: 17px; }
  .ai-markdown h2 { font-size: 15px; }
  .ai-markdown h3 { font-size: 14px; color: var(--accent); }
  .ai-markdown h4 { font-size: 13px; }
  .ai-markdown p { margin: 6px 0; }
  .ai-markdown strong { font-weight: 700; color: var(--text1); }
  .ai-markdown em { font-style: italic; }
  .ai-markdown del { color: var(--text3); }
  .ai-markdown a { color: var(--accent); text-decoration: underline; }
  .ai-markdown a:hover { color: var(--accent2); }
  .ai-markdown ul, .ai-markdown ol {
    margin: 6px 0 6px 0; padding-left: 22px;
  }
  .ai-markdown ul li { list-style: disc; margin: 2px 0; }
  .ai-markdown ol li { list-style: decimal; margin: 2px 0; }
  .ai-markdown ul ul, .ai-markdown ol ul { list-style: circle; }
  .ai-markdown blockquote {
    margin: 8px 0; padding: 6px 10px;
    border-left: 3px solid var(--accent);
    background: rgba(124,111,247,0.06);
    color: var(--text2); font-style: italic;
    border-radius: 0 6px 6px 0;
  }
  .ai-markdown code {
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.18);
    padding: 1px 5px; border-radius: 4px;
    color: var(--text1);
  }
  .ai-markdown pre {
    margin: 8px 0; padding: 10px 12px;
    background: rgba(0,0,0,0.28);
    border: 1px solid var(--border, rgba(255,255,255,0.06));
    border-radius: 8px;
    overflow-x: auto;
    font-size: 12px;
    line-height: 1.5;
  }
  .ai-markdown pre code {
    background: none; padding: 0; color: inherit;
  }
  .ai-markdown hr {
    border: 0; border-top: 1px solid var(--border, rgba(255,255,255,0.08));
    margin: 12px 0;
  }
  /* Tableaux */
  .ai-markdown table {
    width: 100%; border-collapse: collapse; margin: 10px 0;
    font-size: 12px;
    border: 1px solid var(--border, rgba(255,255,255,0.10));
    border-radius: 8px; overflow: hidden;
  }
  .ai-markdown thead {
    background: linear-gradient(135deg, rgba(124,111,247,0.15), rgba(56,189,248,0.10));
  }
  .ai-markdown th, .ai-markdown td {
    padding: 7px 10px; text-align: left;
    border-bottom: 1px solid var(--border, rgba(255,255,255,0.06));
    border-right: 1px solid var(--border, rgba(255,255,255,0.06));
  }
  .ai-markdown th { font-weight: 700; color: var(--text1); }
  .ai-markdown th:last-child, .ai-markdown td:last-child { border-right: 0; }
  .ai-markdown tbody tr:last-child td { border-bottom: 0; }
  .ai-markdown tbody tr:hover { background: rgba(255,255,255,0.025); }
  /* Cellules numériques alignées au centre — heuristique */
  .ai-markdown td:nth-child(n+2):not(:last-child) { /* numérique probable */ }
  /* Badges "critique/élevé/moyen/faible" automatiques sur cellules */
  .ai-markdown td .badge-pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700;
  }
  /* Mermaid container */
  .ai-markdown .mermaid {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border, rgba(255,255,255,0.06));
    border-radius: 8px; padding: 8px;
    margin: 10px 0;
    overflow-x: auto;
    text-align: center;
  }
  .ai-markdown .mermaid svg { max-width: 100%; height: auto; }
  /* Tag de carte / KPI inline */
  .ai-markdown .ai-kpi-card {
    display: inline-flex; flex-direction: column;
    gap: 2px; padding: 8px 12px;
    background: linear-gradient(135deg, rgba(124,111,247,0.10), rgba(56,189,248,0.06));
    border: 1px solid var(--border, rgba(255,255,255,0.08));
    border-radius: 10px;
    margin: 4px 6px 4px 0;
  }
  .ai-markdown .ai-kpi-card .label {
    font-size: 10.5px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .ai-markdown .ai-kpi-card .value {
    font-size: 18px; font-weight: 800; color: var(--text1);
  }
</style>

{# Bibliothèques de rendu — chargées une seule fois par page #}
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js"></script>
<script>
  /* ----------------------------------------------------------------
     Rendu enrichi des réponses IA — Markdown + Mermaid + sanitization.

     Exposé via window.devflowAIRender(el) :
       1. Si `el.dataset.rendered === "1"`, on ne refait rien.
       2. Sinon on parse le `innerHTML` brut (qui peut être Markdown OU
          HTML simple type <strong>) avec marked, on sanitise avec
          DOMPurify, on remplace innerHTML.
       3. On rend les fences mermaid en SVG via mermaid.run().
       4. On annote les cellules de tableau "Priorité/Statut" avec
          des badges colorés (Critique = rouge, Élevé = orange, etc.).
  ---------------------------------------------------------------- */
  (function () {
    if (window.devflowAIRender) return;

    // Init mermaid (theme dark cohérent avec DevFlow)
    let mermaidReady = false;
    function ensureMermaid() {
      if (mermaidReady || typeof mermaid === "undefined") return;
      try {
        mermaid.initialize({
          startOnLoad: false,
          theme: "dark",
          themeVariables: {
            primaryColor: "#7c6ff7",
            primaryTextColor: "#fff",
            primaryBorderColor: "#7c6ff7",
            lineColor: "#94a3b8",
            secondaryColor: "#38bdf8",
            tertiaryColor: "#1e293b",
          },
          securityLevel: "strict",
          fontFamily: "ui-sans-serif, system-ui, sans-serif",
        });
        mermaidReady = true;
      } catch (e) { /* ignore */ }
    }

    // Configure marked : GFM, tables, breaks, smart lists
    function ensureMarked() {
      if (typeof marked === "undefined") return false;
      marked.setOptions({
        gfm: true,
        breaks: true,
        smartLists: true,
        headerIds: false,
        mangle: false,
      });
      return true;
    }

    function badgeForPriority(text) {
      const t = (text || "").trim().toLowerCase();
      const map = {
        "critique":   { bg: "#ef4444", fg: "#fff" },
        "critical":   { bg: "#ef4444", fg: "#fff" },
        "élevée":     { bg: "#f97316", fg: "#fff" },
        "elevee":     { bg: "#f97316", fg: "#fff" },
        "high":       { bg: "#f97316", fg: "#fff" },
        "haute":      { bg: "#f97316", fg: "#fff" },
        "moyenne":    { bg: "#facc15", fg: "#1f2937" },
        "medium":     { bg: "#facc15", fg: "#1f2937" },
        "faible":     { bg: "#22c55e", fg: "#fff" },
        "low":        { bg: "#22c55e", fg: "#fff" },
        "en cours":   { bg: "#38bdf8", fg: "#fff" },
        "planifié":   { bg: "#94a3b8", fg: "#1f2937" },
        "planifie":   { bg: "#94a3b8", fg: "#1f2937" },
        "terminé":    { bg: "#10b981", fg: "#fff" },
        "termine":    { bg: "#10b981", fg: "#fff" },
        "bloqué":     { bg: "#dc2626", fg: "#fff" },
        "bloque":     { bg: "#dc2626", fg: "#fff" },
      };
      const m = map[t];
      if (!m) return null;
      return `<span class="badge-pill" style="background:${m.bg};color:${m.fg}">${text}</span>`;
    }

    function decorateTables(root) {
      root.querySelectorAll("table").forEach(table => {
        // Repère les colonnes Priorité / Statut depuis les headers
        const headers = [...table.querySelectorAll("thead th")].map(th =>
          th.textContent.trim().toLowerCase()
        );
        if (!headers.length) return;
        const colIdx = headers.findIndex(h =>
          h.includes("priorité") || h.includes("priorite") || h === "priority" ||
          h.includes("statut") || h === "status" || h.includes("niveau")
        );
        if (colIdx < 0) return;
        table.querySelectorAll("tbody tr").forEach(tr => {
          const td = tr.children[colIdx];
          if (!td) return;
          // Si la cellule contient juste du texte simple, remplace par un badge
          const txt = td.textContent.trim();
          const badge = badgeForPriority(txt);
          if (badge && !td.querySelector(".badge-pill")) {
            td.innerHTML = badge;
          }
        });
      });
    }

    function renderMermaid(root) {
      ensureMermaid();
      if (!mermaidReady || typeof mermaid === "undefined") return;
      // marked rend ```mermaid ... ``` en <pre><code class="language-mermaid">
      // On les convertit en <div class="mermaid">code</div>
      const blocks = root.querySelectorAll("pre > code.language-mermaid, pre > code.lang-mermaid");
      blocks.forEach((codeEl, idx) => {
        const pre = codeEl.parentElement;
        const wrap = document.createElement("div");
        wrap.className = "mermaid";
        wrap.textContent = codeEl.textContent;
        pre.replaceWith(wrap);
      });
      // Render
      const targets = root.querySelectorAll(".mermaid:not([data-processed])");
      if (targets.length) {
        try {
          mermaid.run({ nodes: targets });
        } catch (e) { /* silencieux */ }
      }
    }

    window.devflowAIRender = function (el) {
      if (!el || el.dataset.rendered === "1") return;
      const raw = el.innerHTML;
      if (!ensureMarked()) {
        // marked pas (encore) chargée — réessaye dans 200ms
        setTimeout(() => window.devflowAIRender(el), 200);
        return;
      }
      try {
        // marked accepte aussi du HTML mélangé — il préserve les tags inline
        const html = marked.parse(raw, { async: false });
        const safe = (typeof DOMPurify !== "undefined")
          ? DOMPurify.sanitize(html, {
              ADD_TAGS: ["foreignObject", "g", "path", "rect", "circle", "line", "polyline", "polygon", "text"],
              ADD_ATTR: ["target", "rel"],
            })
          : html;
        el.innerHTML = safe;
        // Liens externes → nouveau tab
        el.querySelectorAll("a[href^='http']").forEach(a => {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        });
        decorateTables(el);
        renderMermaid(el);
        el.dataset.rendered = "1";
      } catch (e) {
        console.warn("AI render failed:", e);
      }
    };
  })();
</script>

<script>
function devflowAIPanel() {
  return {
    sessionId: null,
    messages: [],
    suggestions: [
      "📊 Analyse du sprint",
      "⚠️ Projets à risque",
      "📋 Générer un rapport",
      "👥 Charge équipe",
    ],
    draft: "",
    loading: false,
    aiOnline: true,
    contextSummary: null,
    csrfToken: null,
    nextLocalId: 1,

    // Tailles : "normal" (380px) -> "expanded" (760px) -> "fullscreen" (100vw)
    sizeMode: "normal",

    init() {
      this.csrfToken = this._readCookie("csrftoken")
        || document.querySelector('meta[name="csrf-token"]')?.content
        || "";
      // Restaure une éventuelle session locale
      const stored = localStorage.getItem("devflow.ai.session_id");
      if (stored) this.sessionId = parseInt(stored, 10) || null;

      // Restaure la dernière taille préférée
      const storedSize = localStorage.getItem("devflow.ai.size_mode");
      if (["normal", "expanded", "fullscreen"].includes(storedSize)) {
        this.sizeMode = storedSize;
      }

      this.fetchWelcome();

      // Hook global pour boutons existants
      window.sendAI = (txt) => this.sendMessage(txt);
      window.sendAIMsg = () => this.submit();
      window.closeAI = () => this.closeAI();
    },

    closeAI() {
      const panel = document.getElementById("aiPanel");
      if (panel) panel.classList.remove("open");
    },

    cycleSize() {
      const order = ["normal", "expanded", "fullscreen"];
      const idx = order.indexOf(this.sizeMode);
      this.sizeMode = order[(idx + 1) % order.length];
      localStorage.setItem("devflow.ai.size_mode", this.sizeMode);
    },

    /**
     * Auto-expand : si la dernière bulle bot contient un tableau de plus de
     * 4 colonnes OU un bloc mermaid OU un <pre>, on passe automatiquement
     * en "expanded" — l'utilisateur peut toujours revenir en normal.
     * Ne touche pas si l'utilisateur a explicitement mis "fullscreen".
     */
    autoResizeIfWide() {
      this.$nextTick(() => {
        if (this.sizeMode === "fullscreen") return;
        // Dernière bulle bot
        const bubbles = document.querySelectorAll("#aiPanel .ai-msg.bot .ai-bubble");
        const last = bubbles[bubbles.length - 1];
        if (!last) return;
        const tables = last.querySelectorAll("table");
        let needsWide = false;
        tables.forEach(t => {
          const cols = t.querySelectorAll("thead th").length
            || (t.querySelector("tr")?.children.length || 0);
          if (cols >= 4) needsWide = true;
        });
        if (last.querySelector(".mermaid svg") || last.querySelector("pre")) {
          needsWide = true;
        }
        if (needsWide && this.sizeMode === "normal") {
          this.sizeMode = "expanded";
          localStorage.setItem("devflow.ai.size_mode", "expanded");
        }
      });
    },

    async fetchWelcome() {
      try {
        const resp = await fetch("{% url 'ai_chat_welcome' %}", {
          credentials: "same-origin",
          headers: { "Accept": "application/json" },
        });
        if (!resp.ok) throw new Error("welcome status " + resp.status);
        const data = await resp.json();
        if (data.ok) {
          this.contextSummary = data.context_summary;
          if (data.suggestions && data.suggestions.length) {
            this.suggestions = data.suggestions;
          }
          this._pushBot(data.html);
        } else {
          this._pushBot("👋 DevFlow AI prête. Posez-moi une question sur vos projets.");
        }
      } catch (err) {
        console.warn("AI welcome failed:", err);
        this._pushBot("👋 DevFlow AI prête. Posez-moi une question.");
        this.aiOnline = false;
      }
    },

    submit() {
      const txt = (this.draft || "").trim();
      if (!txt || this.loading) return;
      this.draft = "";
      this.sendMessage(txt);
    },

    async sendMessage(text) {
      if (!text || this.loading) return;
      this._pushUser(text);
      this.loading = true;

      try {
        const resp = await fetch("{% url 'ai_chat_send' %}", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": this.csrfToken,
            "Accept": "application/json",
          },
          body: JSON.stringify({
            message: text,
            session_id: this.sessionId,
          }),
        });

        const data = await resp.json();
        if (!resp.ok || !data.ok) {
          throw new Error(data.error || "Erreur backend");
        }

        if (data.session_id) {
          this.sessionId = data.session_id;
          localStorage.setItem("devflow.ai.session_id", String(data.session_id));
        }
        this.aiOnline = (data.assistant_message?.used_provider || "heuristic") !== "heuristic";

        this._pushBot(data.assistant_message.content);
      } catch (err) {
        console.warn("AI send failed:", err);
        this._pushBot("⚠️ Erreur de communication avec DevFlow AI. Veuillez réessayer.");
        this.aiOnline = false;
      } finally {
        this.loading = false;
      }
    },

    _pushUser(text) {
      this.messages.push({
        id: "u" + (this.nextLocalId++),
        role: "user",
        html: this._escape(text),
        time: this._fmtNow(),
      });
      this._scrollDown();
    },

    _pushBot(html) {
      this.messages.push({
        id: "b" + (this.nextLocalId++),
        role: "assistant",
        html: html,
        time: "Maintenant",
      });
      this._scrollDown();
      // Détection auto : tableaux larges, mermaid, code → bascule expanded
      // Le rendu markdown s'exécute via x-init devflowAIRender, donc on
      // attend 2 ticks pour que les <table>/.mermaid soient présents.
      setTimeout(() => this.autoResizeIfWide(), 250);
    },

    _scrollDown() {
      this.$nextTick(() => {
        const el = this.$refs.messages;
        if (el) el.scrollTop = el.scrollHeight;
      });
    },

    _escape(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/\n/g, "<br>");
    },

    _fmtNow() {
      const d = new Date();
      return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
    },

    _readCookie(name) {
      const m = document.cookie.match(new RegExp("(^| )" + name + "=([^;]+)"));
      return m ? decodeURIComponent(m[2]) : null;
    },
  };
}
</script>
