

<div
    x-data="devflowChatBubble()"
    x-init="init()"
    x-cloak
>
    {# ─── Bouton flottant ─── #}
    <button
        type="button"
        @click="togglePanel()"
        x-show="!isPanelOpen"
        class="fixed bottom-8 right-6 z-[119] inline-flex h-14 w-14 items-center justify-center
               rounded-full bg-[linear-gradient(135deg,var(--accent),var(--accent2))] text-white
               shadow-[0_18px_40px_rgba(124,111,247,0.35)] transition
               hover:-translate-y-1 hover:scale-[1.02]"
        title="Ouvrir la messagerie"
    >
        <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6"
                 fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9"
                      d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
            {# PR-CHAT-5 : badge messages non lus, MAJ par window.devflowUnread #}
            <span
                data-chat-unread-badge
                style="display:none;"
                class="absolute -right-2 -top-2 min-w-[20px] rounded-full bg-devred
                       border-2 border-[var(--bg)] px-1 text-center text-[10px] font-bold text-white items-center justify-center">
            </span>
        </div>
    </button>

    {# ─── Panneau ─── #}
    <div
        x-show="isPanelOpen"
        x-transition:enter="transition transform duration-200 ease-out"
        x-transition:enter-start="translate-y-4 opacity-0 scale-95"
        x-transition:enter-end="translate-y-0 opacity-100 scale-100"
        x-transition:leave="transition opacity duration-150 ease-in"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed bottom-6 right-6 z-[120] w-[380px] max-w-[calc(100vw-24px)]
               rounded-2xl border border-devborder bg-[var(--bg2)]
               shadow-[0_24px_80px_rgba(15,23,42,0.28)]"
        style="height: 560px; max-height: 75vh;"
    >
        <div class="flex h-full flex-col overflow-hidden rounded-2xl">

            {# Header #}
            <div class="flex items-center justify-between border-b border-devborder px-4 py-3
                        bg-gradient-to-r from-devaccent/10 to-devaccent2/10">
                <div class="flex items-center gap-2 min-w-0">
                    <svg class="w-5 h-5 text-devaccent shrink-0" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                    <div class="min-w-0">
                        <div class="truncate text-sm font-semibold text-devtext1">
                            Messagerie DevFlow
                        </div>
                        <div class="text-[10px] text-devtext3"
                             x-text="selectedChannel
                                ? selectedChannel.display_subtitle
                                : (channels.length + ' discussion' + (channels.length > 1 ? 's' : ''))">
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-1 shrink-0">
                    <a href="{% url 'chat' %}"
                       class="rounded-md p-1 text-devtext3 hover:text-devaccent transition"
                       title="Ouvrir le chat complet">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                    </a>
                    <button type="button" @click="togglePanel()"
                            class="rounded-md p-1 text-devtext3 hover:text-devtext1 transition"
                            title="Fermer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                             fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            {# Vue : liste canaux #}
            <template x-if="!selectedChannel">
                <div class="flex-1 overflow-y-auto">
                    <template x-if="loadingChannels">
                        <div class="p-4 text-center text-xs text-devtext3">Chargement…</div>
                    </template>
                    <template x-if="!loadingChannels && channels.length === 0">
                        <div class="p-6 text-center text-sm text-devtext3">
                            <svg class="w-8 h-8 mx-auto mb-2 text-devtext3" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                            </svg>
                            Aucune discussion pour l'instant.<br>
                            <a href="{% url 'chat' %}" class="text-devaccent hover:underline mt-2 inline-block">
                                Démarrer une discussion →
                            </a>
                        </div>
                    </template>
                    <template x-for="channel in channels.slice(0, 12)" :key="channel.id">
                        <button type="button"
                                :data-chat-channel-card="channel.id"
                                @click="openChannel(channel)"
                                class="chat-channel-row w-full text-left px-3 py-2.5 border-b border-devborder/40
                                       hover:bg-devbg3/60 transition">
                            <div class="flex items-center gap-2 min-w-0">
                                <span class="relative shrink-0 w-8 h-8 rounded-full bg-devbg4
                                             flex items-center justify-center text-devtext2">
                                    {# Icône DM (user) ou groupe (users) #}
                                    <svg x-show="channel.is_dm" class="w-4 h-4" fill="none"
                                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                    </svg>
                                    <svg x-show="!channel.is_dm" class="w-4 h-4" fill="none"
                                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                              d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    </svg>
                                    {# PR-CHAT-1 : pastille présence pour DM uniquement #}
                                    <span x-show="channel.is_dm && channel.other_user_id"
                                          x-html="dotForUser(channel.other_user_id)"
                                          class="absolute -bottom-0.5 -right-0.5"></span>
                                </span>
                                <div class="min-w-0 flex-1">
                                    <div class="flex items-center justify-between gap-2">
                                        <div class="text-sm font-medium truncate"
                                             :class="hasUnread(channel.id) ? 'text-devtext1 font-bold' : 'text-devtext1'"
                                             x-text="channel.display_name"></div>
                                        <div class="text-[10px] text-devtext3 shrink-0"
                                             x-text="formatTime(channel.last_message_at)"></div>
                                    </div>
                                    <div class="flex items-center justify-between gap-2">
                                        <div class="text-[11px] text-devtext3 truncate"
                                             x-text="channel.is_dm
                                                ? (presenceLabel(channel.other_user_id) || channel.last_message_preview || channel.display_subtitle)
                                                : (channel.last_message_preview || channel.display_subtitle)"></div>
                                        {# PR-CHAT-2 : badge unread par canal #}
                                        <span :data-chat-unread-channel="channel.id"
                                              style="display:none;"
                                              class="ml-2 shrink-0 min-w-[18px] rounded-full bg-devred
                                                     px-1.5 text-center text-[10px] font-bold text-white"></span>
                                    </div>
                                </div>
                            </div>
                        </button>
                    </template>
                </div>
            </template>

            {# Vue : conversation active #}
            <template x-if="selectedChannel">
                <div class="flex-1 flex flex-col min-h-0">

                    {# Back + nom canal #}
                    <div class="flex items-center gap-2 border-b border-devborder px-3 py-2">
                        <button type="button" @click="closeChannel()"
                                class="rounded-md p-1 text-devtext3 hover:text-devtext1"
                                title="Retour aux discussions">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                            </svg>
                        </button>
                        <span class="w-7 h-7 rounded-full bg-devbg4 flex items-center justify-center text-devtext2">
                            <svg x-show="selectedChannel.is_dm" class="w-3.5 h-3.5" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            <svg x-show="!selectedChannel.is_dm" class="w-3.5 h-3.5" fill="none"
                                 viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1.5">
                                <span x-show="selectedChannel.is_dm && selectedChannel.other_user_id"
                                      x-html="dotForUser(selectedChannel.other_user_id)"></span>
                                <div class="text-sm font-semibold text-devtext1 truncate"
                                     x-text="selectedChannel.display_name"></div>
                            </div>
                            <div class="text-[10px] text-devtext3 truncate"
                                 x-text="selectedChannel.is_dm
                                    ? (presenceLabel(selectedChannel.other_user_id) || selectedChannel.display_subtitle)
                                    : selectedChannel.display_subtitle"></div>
                        </div>
                        {# PR-CHAT-3 : bouton membres pour les groupes #}
                        <button x-show="!selectedChannel.is_dm"
                                type="button" @click="showMembers = true; loadMembers()"
                                class="shrink-0 rounded-md p-1 text-devtext3 hover:text-devaccent transition"
                                title="Voir les membres">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                                 fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                      d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8 0 4 4 0 018 0zm6 3a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </button>
                    </div>

                    {# Messages #}
                    <div x-ref="bubbleMessages"
                         class="flex-1 overflow-y-auto px-3 py-2 space-y-2 bg-[var(--bg2)]">
                        <template x-if="loadingMessages">
                            <div class="text-center text-[11px] text-devtext3 py-3">Chargement…</div>
                        </template>
                        <template x-for="msg in messages" :key="msg.id">
                            <div class="flex gap-2"
                                 :class="msg.is_self ? 'flex-row-reverse' : ''">
                                <div class="max-w-[80%]">
                                    <div class="flex items-baseline gap-2 mb-0.5"
                                         :class="msg.is_self ? 'justify-end' : ''">
                                        <span class="text-[10px] font-semibold text-devtext2"
                                              x-text="msg.is_self ? 'Vous' : msg.author_name"></span>
                                        <span class="text-[9px] text-devtext3"
                                              x-text="formatTime(msg.created_at)"></span>
                                    </div>
                                    <div class="rounded-2xl px-3 py-1.5 text-xs whitespace-pre-wrap break-words"
                                         :class="msg.is_self
                                                  ? 'bg-devaccent text-white'
                                                  : 'bg-devbg3 text-devtext1 border border-devborder'"
                                         x-text="msg.body"></div>
                                </div>
                            </div>
                        </template>
                        <template x-if="!loadingMessages && messages.length === 0">
                            <div class="text-center text-[11px] text-devtext3 py-4">
                                Aucun message — soyez le premier !
                            </div>
                        </template>
                    </div>

                    {# PR-CHAT-4 : indicateur typing #}
                    <div x-show="typingUsers.length > 0"
                         class="px-3 py-1 text-[11px] text-devtext3 italic flex items-center gap-1.5
                                bg-[var(--bg2)] border-t border-devborder/40">
                        <span class="inline-flex gap-0.5">
                            <span class="w-1 h-1 rounded-full bg-devaccent animate-pulse"></span>
                            <span class="w-1 h-1 rounded-full bg-devaccent animate-pulse" style="animation-delay:.15s"></span>
                            <span class="w-1 h-1 rounded-full bg-devaccent animate-pulse" style="animation-delay:.3s"></span>
                        </span>
                        <span x-text="typingLabel()"></span>
                    </div>

                    {# PR-CHAT-3 : Modal membres du groupe (overlay) #}
                    <div x-show="showMembers"
                         x-cloak
                         class="absolute inset-0 z-10 bg-[var(--bg2)]/95 backdrop-blur-sm
                                rounded-2xl flex flex-col">
                        <div class="flex items-center justify-between border-b border-devborder px-4 py-3">
                            <div class="text-sm font-semibold text-devtext1">Membres du groupe</div>
                            <button type="button" @click="showMembers = false"
                                    class="rounded-md p-1 text-devtext3 hover:text-devtext1"
                                    title="Fermer">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4"
                                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                            </button>
                        </div>
                        <div class="flex-1 overflow-y-auto p-2">
                            <template x-if="loadingMembers">
                                <div class="text-center text-xs text-devtext3 py-3">Chargement…</div>
                            </template>
                            <template x-for="m in channelMembers" :key="m.user_id">
                                <div class="flex items-center gap-2 px-2 py-2 rounded-md hover:bg-devbg3/50">
                                    <span class="relative w-7 h-7 rounded-full bg-devbg4 flex items-center justify-center text-[10px] font-semibold text-devtext2">
                                        <span x-text="(m.display_name||'?').slice(0,2).toUpperCase()"></span>
                                        <span x-html="dotForUser(m.user_id)"
                                              class="absolute -bottom-0.5 -right-0.5"></span>
                                    </span>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-xs font-medium text-devtext1 truncate">
                                            <span x-text="m.display_name"></span>
                                            <span x-show="m.is_self" class="text-devtext3">(vous)</span>
                                        </div>
                                        <div class="text-[10px] text-devtext3 truncate"
                                             x-text="presenceLabel(m.user_id)"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    {# Composeur #}
                    <form @submit.prevent="sendMessage()"
                          class="border-t border-devborder p-2 flex items-end gap-2">
                        <textarea
                            x-model="composer"
                            x-ref="bubbleComposer"
                            @keydown.enter.prevent="$event.shiftKey ? (composer += '\n') : sendMessage()"
                            @input="emitTyping()"
                            placeholder="Écrire…"
                            rows="1"
                            class="flex-1 resize-none rounded-md border border-devborder bg-devbg3
                                   px-2 py-1.5 text-xs text-devtext1 placeholder:text-devtext3
                                   focus:outline-none focus:border-devaccent"
                            :disabled="sending"
                            style="max-height: 80px;"></textarea>
                        <button type="submit"
                                :disabled="sending || !composer.trim()"
                                class="shrink-0 rounded-md bg-devaccent text-white px-3 py-1.5 text-xs font-medium
                                       hover:opacity-90 transition disabled:opacity-50">
                            <span x-show="!sending">Envoyer</span>
                            <span x-show="sending">…</span>
                        </button>
                    </form>
                </div>
            </template>
        </div>
    </div>
</div>

<style>
  .chat-channel-row.has-unread .text-devtext3 { color: var(--devaccent); }
</style>
<script>
    /* Bulle flottante Messagerie DevFlow — Alpine.js
       Consomme /api/v1/me/chat/* via window.devflowApi.
       Branche window.devflowPresence + window.devflowUnread + WS typing. */
    document.addEventListener("alpine:init", () => {
        Alpine.data("devflowChatBubble", () => ({
            isPanelOpen: false,
            channels: [],
            loadingChannels: false,

            selectedChannel: null,
            messages: [],
            loadingMessages: false,
            composer: "",
            sending: false,

            pollTimer: null,
            lastMessageId: 0,

            // PR-CHAT-3 : modal membres
            showMembers: false,
            channelMembers: [],
            loadingMembers: false,

            // PR-CHAT-4 : WebSocket + typing
            ws: null,
            typingUsers: [],          // [{user_id, display_name, expires_ts}]
            typingPurgeTimer: null,
            typingSentAt: 0,
            typingStopTimer: null,

            init() {
                this.isPanelOpen = sessionStorage.getItem("devflowChatBubbleOpen") === "1";
                if (this.isPanelOpen) this.loadChannels();
                // Re-fetch présence pour les DM affichés quand l'événement
                // devflow:presence-updated tombe.
                window.addEventListener("devflow:unread-changed", () => {
                    // Trigger refresh visuel si Alpine perd la trace
                    this.$nextTick(() => {});
                });
                this.typingPurgeTimer = setInterval(() => this.purgeStaleTyping(), 1500);
            },

            togglePanel() {
                this.isPanelOpen = !this.isPanelOpen;
                sessionStorage.setItem("devflowChatBubbleOpen", this.isPanelOpen ? "1" : "0");
                if (this.isPanelOpen) {
                    this.loadChannels();
                } else {
                    this.stopPolling();
                    this.closeWebSocket();
                    this.selectedChannel = null;
                }
            },

            async loadChannels() {
                this.loadingChannels = true;
                try {
                    const data = await window.devflowApi.get("/api/v1/me/chat/channels/");
                    this.channels = (data && data.channels) || [];
                    // Préchauffe la présence des DM (autre membre)
                    const dmUserIds = this.channels
                        .filter(c => c.is_dm && c.other_user_id)
                        .map(c => c.other_user_id);
                    if (dmUserIds.length && window.devflowPresence) {
                        window.devflowPresence.fetchFor(dmUserIds);
                    }
                } finally {
                    this.loadingChannels = false;
                }
            },

            hasUnread(channelId) {
                if (!window.devflowUnread) return false;
                return (window.devflowUnread.state.by_channel || {})[channelId] > 0;
            },

            dotForUser(userId) {
                if (!userId || !window.devflowPresence) return "";
                return window.devflowPresence.dotHtml(userId);
            },

            presenceLabel(userId) {
                if (!userId || !window.devflowPresence) return "";
                return window.devflowPresence.labelFor(userId);
            },

            formatTime(iso) {
                if (!iso) return "";
                const d = new Date(iso);
                const now = new Date();
                const sameDay = d.toDateString() === now.toDateString();
                if (sameDay) {
                    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                }
                return d.toLocaleDateString([], { day: "2-digit", month: "2-digit" });
            },

            async openChannel(channel) {
                this.selectedChannel = channel;
                this.messages = [];
                this.lastMessageId = 0;
                this.loadingMessages = true;
                this.typingUsers = [];
                try {
                    const data = await window.devflowApi.get(
                        `/api/v1/me/chat/channels/${channel.id}/messages/`
                    );
                    if (data) {
                        this.messages = data.messages || [];
                        if (this.messages.length) {
                            this.lastMessageId = this.messages[this.messages.length - 1].id;
                        }
                        this.$nextTick(() => this.scrollToBottom());
                    }
                } finally {
                    this.loadingMessages = false;
                }
                // Mark-as-read au focus du canal
                if (window.devflowUnread) {
                    window.devflowUnread.markRead(channel.id);
                }
                this.startPolling();
                this.openWebSocket();
            },

            closeChannel() {
                this.stopPolling();
                this.closeWebSocket();
                this.selectedChannel = null;
                this.messages = [];
                this.typingUsers = [];
                this.showMembers = false;
                this.loadChannels();
                if (window.devflowUnread) window.devflowUnread.refresh();
            },

            scrollToBottom() {
                const el = this.$refs.bubbleMessages;
                if (el) el.scrollTop = el.scrollHeight;
            },

            async sendMessage() {
                const body = (this.composer || "").trim();
                if (!body || !this.selectedChannel || this.sending) return;
                this.sending = true;
                try {
                    const msg = await window.devflowApi.post(
                        `/api/v1/me/chat/channels/${this.selectedChannel.id}/messages/`,
                        { body }
                    );
                    if (msg && msg.id) {
                        this.messages.push(msg);
                        this.lastMessageId = msg.id;
                        this.composer = "";
                        this.$nextTick(() => this.scrollToBottom());
                        this.sendTypingStop();
                    }
                } finally {
                    this.sending = false;
                    this.$refs.bubbleComposer && this.$refs.bubbleComposer.focus();
                }
            },

            startPolling() {
                this.stopPolling();
                this.pollTimer = setInterval(async () => {
                    if (!this.selectedChannel || !this.isPanelOpen || document.hidden) return;
                    try {
                        const data = await window.devflowApi.get(
                            `/api/v1/me/chat/channels/${this.selectedChannel.id}/messages/?after=${this.lastMessageId}`
                        );
                        if (data && data.messages && data.messages.length) {
                            this.messages.push(...data.messages);
                            this.lastMessageId = data.messages[data.messages.length - 1].id;
                            this.$nextTick(() => this.scrollToBottom());
                            // Auto mark-read si on est dans le canal
                            if (window.devflowUnread) {
                                window.devflowUnread.markRead(this.selectedChannel.id);
                            }
                        }
                    } catch (e) { /* silent */ }
                }, 6000);
            },

            stopPolling() {
                if (this.pollTimer) {
                    clearInterval(this.pollTimer);
                    this.pollTimer = null;
                }
            },

            // ── WebSocket : typing indicator + push messages temps réel ──
            openWebSocket() {
                this.closeWebSocket();
                if (!this.selectedChannel) return;
                try {
                    const proto = window.location.protocol === "https:" ? "wss" : "ws";
                    const url = `${proto}://${window.location.host}/ws/chat/${this.selectedChannel.id}/`;
                    const ws = new WebSocket(url);
                    ws.onmessage = (ev) => this.onWsMessage(ev);
                    ws.onerror = () => { /* silencieux */ };
                    ws.onclose = () => { this.ws = null; };
                    this.ws = ws;
                } catch (e) { this.ws = null; }
            },

            closeWebSocket() {
                if (this.ws) {
                    try { this.ws.close(); } catch {}
                    this.ws = null;
                }
            },

            onWsMessage(ev) {
                let payload;
                try { payload = JSON.parse(ev.data || "{}"); } catch { return; }
                if (payload.type === "typing") {
                    const uid = payload.user_id;
                    const name = payload.display_name || payload.username || "Quelqu'un";
                    const existing = this.typingUsers.find(t => t.user_id === uid);
                    if (payload.is_typing) {
                        const entry = { user_id: uid, display_name: name, expires_ts: Date.now() + 5000 };
                        if (existing) Object.assign(existing, entry);
                        else this.typingUsers.push(entry);
                    } else {
                        this.typingUsers = this.typingUsers.filter(t => t.user_id !== uid);
                    }
                } else if (payload.type === "chat_message" && payload.message) {
                    // Évite les doublons avec le polling : compare l'ID
                    if (this.messages.some(m => m.id === payload.message.id)) return;
                    if (payload.message.id > this.lastMessageId) {
                        this.messages.push({
                            id: payload.message.id,
                            body: payload.message.body,
                            author_name: payload.message.author,
                            author_id: payload.message.author_id,
                            is_self: payload.message.is_mine,
                            created_at: payload.message.created_at,
                            parent_id: payload.message.parent_id,
                        });
                        this.lastMessageId = payload.message.id;
                        this.$nextTick(() => this.scrollToBottom());
                        if (window.devflowUnread) {
                            window.devflowUnread.markRead(this.selectedChannel.id);
                        }
                    }
                }
            },

            purgeStaleTyping() {
                const now = Date.now();
                const before = this.typingUsers.length;
                this.typingUsers = this.typingUsers.filter(t => t.expires_ts > now);
                if (this.typingUsers.length !== before) { /* trigger reactivity */ }
            },

            typingLabel() {
                if (!this.typingUsers.length) return "";
                if (this.typingUsers.length === 1) {
                    return `${this.typingUsers[0].display_name} est en train d'écrire…`;
                }
                const names = this.typingUsers.slice(0, 2).map(t => t.display_name).join(", ");
                return this.typingUsers.length > 2
                    ? `${names} et d'autres écrivent…`
                    : `${names} sont en train d'écrire…`;
            },

            emitTyping() {
                if (!this.ws || this.ws.readyState !== 1) return;
                const now = Date.now();
                // throttle : 1 typing.start max toutes les 2.5s
                if (now - this.typingSentAt < 2500) return;
                this.typingSentAt = now;
                try { this.ws.send(JSON.stringify({ type: "typing.start" })); } catch {}
                // Programme un typing.stop si l'user arrête de taper
                if (this.typingStopTimer) clearTimeout(this.typingStopTimer);
                this.typingStopTimer = setTimeout(() => this.sendTypingStop(), 3500);
            },

            sendTypingStop() {
                if (this.typingStopTimer) {
                    clearTimeout(this.typingStopTimer);
                    this.typingStopTimer = null;
                }
                if (this.ws && this.ws.readyState === 1) {
                    try { this.ws.send(JSON.stringify({ type: "typing.stop" })); } catch {}
                }
                this.typingSentAt = 0;
            },

            // ── PR-CHAT-3 : Membres du groupe ───────────────────────────
            async loadMembers() {
                if (!this.selectedChannel) return;
                this.loadingMembers = true;
                try {
                    const data = await window.devflowApi.get(
                        `/api/v1/me/chat/channels/${this.selectedChannel.id}/members/`
                    );
                    this.channelMembers = (data && data.members) || [];
                    // Force refresh présence pour les membres
                    if (window.devflowPresence) {
                        window.devflowPresence.fetchFor(this.channelMembers.map(m => m.user_id));
                    }
                } finally {
                    this.loadingMembers = false;
                }
            },
        }));
    });
</script>
